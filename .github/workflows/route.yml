name: route

# Checks cleaned papers' own headers against where the site files them:
# fills empty exam type / year, proposes subject moves for a person to
# approve in /admin/review. Every 3 hours; uses up to 5 Gemini and 5 Groq
# keys (secrets GEMINI_API_KEY, GEMINI_API_KEY_2 ... and GROQ_...). Add a
# key = add a secret; a missing one is simply skipped. A run that made
# progress with papers left starts the next one itself; each cleaning run
# also starts one when it ends.
on:
  schedule:
    - cron: "25 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Most papers to check in this run"
        default: "300"

permissions:
  contents: read

concurrency:
  group: route
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    outputs:
      since: ${{ steps.t.outputs.since }}
    steps:
      - id: t
        run: echo "since=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Route
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          PIPELINE_DB_TOKEN: ${{ secrets.PIPELINE_DB_TOKEN }}
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          LIVE_DB_URL: ${{ secrets.LIVE_DB_URL }}
          LIVE_DB_TOKEN: ${{ secrets.LIVE_DB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
        run: python -m pwpipe route --limit ${{ inputs.limit || '1500' }} --max-minutes 150

  next:
    needs: route
    if: ${{ !cancelled() && needs.route.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          PIPELINE_DB_TOKEN: ${{ secrets.PIPELINE_DB_TOKEN }}
        run: |
          if python -m pwpipe next route --since "${{ needs.route.outputs.since }}" --owner route; then
            bash scripts/start_run.sh route.yml -f limit=1500
          fi
