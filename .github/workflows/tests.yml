name: tests

# Push to main and manual runs only - never pull_request. This repo is public
# and later workflows here hold secrets; nothing triggered by a stranger's PR
# should run in it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned OCR models
        run: python scripts/fetch_tessdata.py
      - name: Run tests
        # The state tests also run against the throwaway -test Turso database
        # (they wipe it; the fixture refuses any URL without "-test-").
        env:
          PIPELINE_TEST_DB_URL: ${{ secrets.PIPELINE_TEST_DB_URL }}
          PIPELINE_TEST_DB_TOKEN: ${{ secrets.PIPELINE_TEST_DB_TOKEN }}
        run: python -m pytest tests -q -rs
