name: health

# Daily check that the pipeline can run and is running. On a problem it opens
# (or comments on) one issue titled "Pipeline health", which emails the owner.
on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: write     # monthly keep-alive commit
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check
        id: check
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          PIPELINE_DB_TOKEN: ${{ secrets.PIPELINE_DB_TOKEN }}
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          set +e
          python -m pwpipe health > health.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat health.md >> "$GITHUB_STEP_SUMMARY"
          cat health.md
      - name: Open or update the health issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search "Pipeline health in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file health.md
          else
            gh issue create --title "Pipeline health: needs attention" --body-file health.md
          fi
          exit 1
      # GitHub disables schedules in a public repo after 60 days without a
      # commit. One tiny commit a month keeps the backup schedules alive.
      # Runs the publish chain starts count too: it starts one daily.
      - name: Monthly keep-alive
        if: always()
        run: |
          [ "$(date -u +%d)" = "01" ] || exit 0
          date -u +%F > .github/keepalive
          git add .github/keepalive
          git diff --cached --quiet && exit 0   # already done today
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keep-alive $(date -u +%F)"
          git push
